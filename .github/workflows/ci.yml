name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Self-test (zero dependencies)
        run: python selftest.py
      - name: Install development dependencies and run suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
          python -m pytest -q
      - name: Build wheel and import outside the source checkout
        run: |
          python -m pip wheel --no-deps . -w dist
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -I -c "import app.main, app.guard, app.metrics"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build image
        run: docker build -t guarded-llm-service .
      - name: Smoke test the running container
        run: |
          docker run -d -p 8000:8000 --name svc guarded-llm-service
          for i in $(seq 1 10); do
            curl -fsS http://127.0.0.1:8000/health && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/evaluate \
            -H 'content-type: application/json' \
            --data @examples/request.json
          docker rm -f svc
