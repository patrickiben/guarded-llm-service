[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guarded-llm-service"
version = "0.1.0"
description = "A FastAPI service that serves the numguard guardrail: every number in a draft must be traceable to a fact."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Patrick Iben", email = "p.iben@saeny.net"}]
keywords = ["fastapi", "mlops", "llm", "guardrails", "inference", "docker", "monitoring"]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/patrickiben/guarded-llm-service"

[tool.setuptools]
packages = ["app"]
